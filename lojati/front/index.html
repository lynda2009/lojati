<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LojaTI | Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Loja<span>TI</span></h1>
        <p>Gerenciamento de clientes</p>
    </header>

    <main>
        <section class="card">
            <h2>Novo Cliente</h2>

            <form id="formCliente">
                <label for="Nome">Nome:</label>
                <input type="text" id="Nome" maxlength="100" required>

                <label for="Email">E-mail:</label>
                <input type="email" id="Email" maxlength="100" required>

                <label for="Telefone">Telefone:</label>
                <input type="tel" id="Telefone" maxlength="15">

                <label for="Endereco">Endereço:</label>
                <input type="text" id="Endereco" maxlength="100">

                <button type="submit" id="btnCadastrar">
                    Cadastrar Cliente
                </button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Clientes Cadastrados</h2>

            <button type="button" id="btnAtualizar">
                Atualizar Lista
            </button>

            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                        </tr>
                    </thead>
                    <tbody id="listaClientes">
                        <tr>
                            <td colspan="5">Carregando clientes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>LojaTI &copy; 2026 - Sistema de Clientes</p>
    </footer>

    <script>
        const API = "../back/index.php?rota=";

        const formulario = document.getElementById("formCliente");
        const mensagem = document.getElementById("mensagem");
        const lista = document.getElementById("listaClientes");
        const botaoCadastrar = document.getElementById("btnCadastrar");

        async function requisicao(url, opcoes = {}) {
            const resposta = await fetch(url, opcoes);
            const texto = await resposta.text();

            let dados;

            try {
                dados = JSON.parse(texto);
            } catch {
                throw new Error(
                    "Resposta inválida do PHP. Confira o backend."
                );
            }

            if (!resposta.ok) {
                throw new Error(
                    dados.erro || "Ocorreu um erro na requisição."
                );
            }

            return dados;
        }

        async function carregarClientes() {
            lista.innerHTML =
                "<tr><td colspan='5'>Carregando clientes...</td></tr>";

            try {
                const clientes = await requisicao(API + "clientes");

                if (!Array.isArray(clientes)) {
                    throw new Error("A resposta da consulta é inválida.");
                }

                lista.replaceChildren();

                if (clientes.length === 0) {
                    lista.innerHTML =
                        "<tr><td colspan='5'>Nenhum cliente cadastrado.</td></tr>";
                    return;
                }

                clientes.forEach(cliente => {
                    const linha = document.createElement("tr");

                    const valores = [
                        cliente.ClienteID,
                        cliente.Nome,
                        cliente.Email,
                        cliente.Telefone || "-",
                        cliente.Endereco || "-"
                    ];

                    valores.forEach(valor => {
                        const coluna = document.createElement("td");
                        coluna.textContent = valor;
                        linha.appendChild(coluna);
                    });

                    lista.appendChild(linha);
                });

            } catch (erro) {
                lista.innerHTML =
                    "<tr><td colspan='5'>Não foi possível carregar os clientes.</td></tr>";

                mensagem.textContent = erro.message;
                mensagem.className = "erro";
            }
        }

        formulario.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const cliente = {
                Nome: document.getElementById("Nome").value.trim(),
                Email: document.getElementById("Email").value.trim(),
                Telefone: document.getElementById("Telefone").value.trim(),
                Endereco: document.getElementById("Endereco").value.trim()
            };

            botaoCadastrar.disabled = true;
            botaoCadastrar.textContent = "Cadastrando...";
            mensagem.textContent = "";
            mensagem.className = "";

            try {
                const resultado = await requisicao(
                    API + "clientes/create",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(cliente)
                    }
                );

                mensagem.textContent = resultado.mensagem;
                mensagem.className = "sucesso";

                formulario.reset();

                await carregarClientes();

            } catch (erro) {
                mensagem.textContent = erro.message;
                mensagem.className = "erro";

            } finally {
                botaoCadastrar.disabled = false;
                botaoCadastrar.textContent = "Cadastrar Cliente";
            }
        });

        document.getElementById("btnAtualizar")
            .addEventListener("click", carregarClientes);

        carregarClientes();
    </script>

</body>
</html>
